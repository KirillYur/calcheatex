<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Вход в аккаунт</title>
</head>
<body>
    <section class="login">
        <div class="login-title">
            <h2>Вход в систему</h2>
        </div>
        {% include "users/includes/notifications.html" %}
        <form class="login-form" action="{% url 'user:login' %}" method="POST">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" value="{% if form.username.value %}{{ form.username.value }}{% endif %}"
                name="username" id="id_username" placeholder="Имя пользователя" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" value="{% if form.password.value %}{{ form.password.value }}{% endif %}"
                name="password" id="id_password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="login-btn">Войти</button>
        </form>
        <div class="reset-pass">
            <a href="{% url 'user:registration' %}">Создать аккаунт</a> | 
            <a href="#">Забыли пароль?</a>
        </div>
    </section>
</body>
</html>
