<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчет пластинчатого теплообменника</title>
    <link rel="stylesheet" type="text/css" href="static/style.css">
    {% load static %}
</head>
<body>
    <div class="mainPageCalc">
        <form name = 'calcheatex'>
            <h1 class = "form_title">Расчет пластинчатого теплообменника</h1>
            {% csrf_token %}
            <div class="inputMainArea">
                <div class = 'inputHotArea'>
                    <span class="spanHotCoolant">Горячий теплоноситель</span>
                    <p><input name="tempHotIn" type="text" class="form_input" placeholder="t1 на входе, °C"></p>
                    <p><input name="tempHotOut" type="text" class="form_input" placeholder="t1 на выходе, °C"></p>
                    <p><input name="flowHot" type="text" class="form_input" placeholder="Расход горячего теплоносителя, м3/ч"></p>
                    <p><input name="pressureHot" type="text" class="form_input" placeholder="Давление горячего теплоносителя, бар"></p>
                    <p>
                        <select name="selectTypeHotCoolant" class="selectTypeHotCoolant" >
                            <option value="Water">Вода</option>
                            <option value="Air">Воздух</option>
                            <option value="humidAir">Влажный воздух</option>
                            <option value="Ethylene">Этилен</option>
                            <option value="Propylene">Пропилен</option>
                        </select>
                    </p>
                </div>
                <div class="inputAreaCenter">
                    <img src="static/teplo_calc_center.jpg" alt="" width="240" height="200">
                </div>
                <div class='inputColdArea'>
                    <span class="spanColdCoolant">Холодный теплоноситель</span>
                    <p><input name="tempColdIn" type="text" class="form_input" placeholder="t2 на входе, °C"></p>
                    <p><input name="tempColdOut" type="text" class="form_input" placeholder="t2 на выходе, °C"></p>
                    <p><input name="flowCold" type="text" class="form_input" placeholder="Расход холодного теплоносителя, м3/ч"></p>
                    <p><input name="pressureCold" type="text" class="form_input" placeholder="Давление холодного теплоносителя, бар"></p>
                    <p>
                        <select name="selectTypeColdCoolant" class="selectTypeColdCoolant">
                            <option value="Water">Вода</option>
                            <option value="Air">Воздух</option>
                            <option value="humidAir">Влажный воздух</option>
                            <option value="Ethylene">Этилен</option>
                            <option value="Propylene">Пропилен</option>
                        </select>
                    </p>
                </div>
            </div>
            <p><button class='calcheatexBtn' type='submit' name='calcheatexBtn'>Рассчитать</button></p>
            <table class='form_table' id="form_table">
                <tr>
                    <td>
                        <h3 id ='resultHotDensity'></h3>
                    </td>
                    <td>
                        <h3 id ='resultColdDensity'></h3>
                    </td>
                </tr>
            </table>
        </form>
    </div>
    <script>
        document.forms.calcheatex.onsubmit = function(event){
            event.preventDefault();
            
            var csrf_token = document.forms.calcheatex.csrfmiddlewaretoken.value;

            var userTempHotIn = document.forms.calcheatex.tempHotIn.value;
            var userTempHotOut = document.forms.calcheatex.tempHotOut.value;
            var userFlowHot = document.forms.calcheatex.flowHot.value;
            var userPressureHot = document.forms.calcheatex.pressureHot.value;

            var userTempColdIn = document.forms.calcheatex.tempColdIn.value;
            var userTempColdOut = document.forms.calcheatex.tempColdOut.value;
            var userFlowCold = document.forms.calcheatex.flowCold.value;
            var userPressureCold = document.forms.calcheatex.pressureCold.value;

            var userSelectTypeColdCoolant = document.forms.calcheatex.selectTypeColdCoolant.value;
            var userSelectTypeHotCoolant = document.forms.calcheatex.selectTypeHotCoolant.value;

            var xhr = new XMLHttpRequest();

            xhr.open('POST', '/calculation', async);

            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

            xhr.onreadystatechange = function(){
                
                if(xhr.readyState === 4 && xhr.status === 200){
                    var resultHotDensity = document.querySelector('#resultHotDensity');
                    var resultColdDensity = document.querySelector('#resultColdDensity');
                    var resultObjParse = JSON.parse(xhr.responseText);
                    
                    resultHotDensity.textContent = 'Плотность по горячему = ' 
                    + resultObjParse.resultHotDensity;
                    resultColdDensity.textContent = 'Плотность по холодному = ' 
                    + resultObjParse.resultColdDensity;
                
                    if (resultObjParse) {
                    document.getElementById("form_table").style.display = "table"; // Отобразить таблицу
                    } else {
                    document.getElementById("form_table").style.display = "none"; // Скрыть таблицу
                    }
                }
            }
            
            var body = 
                '&tempHotIn=' + encodeURIComponent(userTempHotIn) +
                '&tempHotOut=' + encodeURIComponent(userTempHotOut)+
                '&flowHot=' + encodeURIComponent(userFlowHot)+
                '&pressureHot=' + encodeURIComponent(userPressureHot)+

                '&tempColdIn=' + encodeURIComponent(userTempColdIn) +
                '&tempColdOut=' + encodeURIComponent(userTempColdOut)+
                '&flowCold=' + encodeURIComponent(userFlowCold)+
                '&pressureCold=' + encodeURIComponent(userPressureCold)+

                '&selectTypeColdCoolant=' + encodeURIComponent(userSelectTypeColdCoolant)+
                '&selectTypeHotCoolant=' + encodeURIComponent(userSelectTypeHotCoolant)+

                '&csrfmiddlewaretoken=' + encodeURIComponent(csrf_token);

            xhr.send(body);
        }
    </script>
</body>
</html>
